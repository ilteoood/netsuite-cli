version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
    groups:
      tooling:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      runtime:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      security-patches:
        applies-to: "security-updates"
        patterns: ["*"]
        update-types: ["patch", "minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
    groups:
      actions:
        patterns: ["*"]
